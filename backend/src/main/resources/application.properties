spring.application.name=skillswap-backend

spring.data.mongodb.uri=mongodb://localhost:27017/skillswap_test

app.jwt.secret=test-secret-key-for-testing-purposes-only-not-for-production-use
app.jwt.access-token-expiration-ms=3600000
app.jwt.reset-token-expiration-ms=900000

# Prevent Spring Boot from trying to spin up embedded Mongo
spring.autoconfigure.exclude=de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration