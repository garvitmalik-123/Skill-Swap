spring.application.name=skillswap-backend

# ------------------------------
# MongoDB
# ------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/skillswap}

# ------------------------------
# JWT
# ------------------------------
# IMPORTANT: override this via env var in real deployments, never commit a real secret
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-base64-secret-change-this-to-a-long-random-base64-secret}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
app.jwt.reset-token-expiration-ms=${JWT_RESET_EXPIRATION_MS:900000}

# ------------------------------
# Server
# ------------------------------
server.port=${PORT:8080}

# ------------------------------
# Logging
# ------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.skillswap.skillswap.backend=DEBUG